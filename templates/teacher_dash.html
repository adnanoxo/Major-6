<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Portal | Result Entry</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        background: linear-gradient(to right, #3206fb, #42bae9);
        color: #fff;
        display: flex;
        min-height: 100vh;
    }

    /* Sidebar - Matching your Admin/Student Design */
    .sidebar {
        width: 230px;
        height: 100vh;
        background: #2e2e2e;
        padding: 20px;
        position: fixed;
    }

    .sidebar h2 { text-align: center; margin-bottom: 30px; }

    .sidebar a {
        display: block;
        color: #fddf02;
        text-decoration: none;
        margin: 12px 0;
        padding: 12px;
        border-radius: 8px;
        transition: 0.3s;
    }

    .sidebar a:hover, .sidebar .active {
        background: #f4c404;
        color: #fff;
        transform: translate(5px);
        box-shadow: 0 0 18px rgba(253,223,2,0.4); 
    }

    .main {
        margin-left: 270px;
        padding: 30px;
        width: calc(100% - 310px);
    }

    /* Glass Header */
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 25px;
        background: rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(12px);
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.15);
        margin-bottom: 30px;
    }

    /* Search & Filter Card */
    .filter-card {
        background: white;
        padding: 20px;
        border-radius: 12px;
        display: flex;
        gap: 20px;
        margin-bottom: 30px;
        color: #333;
    }

    .filter-group { display: flex; flex-direction: column; flex: 1; }
    
    .filter-group label { font-size: 12px; font-weight: 600; margin-bottom: 5px; color: #666; }

    select, input {
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
        outline: none;
    }

    .logout {
        background: #ff815e;
        padding: 8px 16px;
        border-radius: 6px;
        text-decoration: none;
        color: white;
    }

    /* Entry Table */
    .entry-table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
        color: #333;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .entry-table th { background: #f4c404; color: #000; padding: 15px; text-align: left; }
    
    .entry-table td { padding: 12px 15px; border-bottom: 1px solid #eee; }

    .marks-input {
        width: 60px;
        padding: 8px;
        text-align: center;
        border: 2px solid #3206fb;
        border-radius: 4px;
        font-weight: bold;
    }

    .status-badge {
        padding: 5px 10px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        background: #eee;
    }

    .btn-submit {
        background: #3206fb;
        color: white;
        border: none;
        padding: 15px 30px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        float: right;
        margin-top: 20px;
        transition: 0.3s;
    }

    .btn-submit:hover {
        background: #2575fc;
        transform: scale(1.02);
        box-shadow: 0 5px 15px rgba(50, 6, 251, 0.4);
    }
</style>
</head>

<body>

<div class="sidebar">
    <h2>Teacher Panel</h2>
    <a href="#">Dashboard</a>
    <a href="#" class="active">Upload Marks</a>
    <a href="#">Attendance</a>
    <a href="#">Classes</a>
    <a href="#">Profile</a>
</div>

<div class="main">
    <div class="header">
        <h1>Result Management</h1>
        <div style="text-align: right;">
            <a href="index.html" class="logout">Logout</a>
        </div>
    </div>

    <div class="filter-card">
        <div class="filter-group">
            <label>Select Course</label>
            <select>
                <option>BCA - 2nd Year</option>
                <option>MCA - 1st Year</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Subject</label>
            <select>
                <option>Database Management</option>
                <option>Operating Systems</option>
                <option>Data Structures</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Exam Type</label>
            <select>
                <option>Final Term (2026)</option>
                <option>Mid Term</option>
            </select>
        </div>
    </div>

    <form id="marksForm">
        <table class="entry-table">
            <thead>
                <tr>
                    <th>Enrollment No</th>
                    <th>Student Name</th>
                    <th>Marks (Out of 100)</th>
                    <th>Grade</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>ERP-2026-BCA-001</td>
                    <td>Rahul Sharma</td>
                    <td><input type="number" class="marks-input" value="0" onchange="updateGrade(this)"></td>
                    <td class="grade-cell" style="font-weight: 600;">F</td>
                    <td><span class="status-badge">Pending</span></td>
                </tr>
                <tr>
                    <td>ERP-2026-BCA-002</td>
                    <td>Anjali Verma</td>
                    <td><input type="number" class="marks-input" value="0" onchange="updateGrade(this)"></td>
                    <td class="grade-cell" style="font-weight: 600;">F</td>
                    <td><span class="status-badge">Pending</span></td>
                </tr>
            </tbody>
        </table>

        <button type="button" class="btn-submit" onclick="confirmSubmission()">
            Confirm & Send to Admin
        </button>
    </form>
</div>

<script>
    // Logic to Auto-Calculate Grade based on Marks
    function updateGrade(input) {
        let marks = parseInt(input.value);
        let row = input.parentElement.parentElement;
        let gradeCell = row.querySelector('.grade-cell');
        let badge = row.querySelector('.status-badge');
        
        let grade = "F";
        let color = "red";

        if (marks >= 90) { grade = "A+"; color = "green"; }
        else if (marks >= 80) { grade = "A"; color = "green"; }
        else if (marks >= 70) { grade = "B+"; color = "orange"; }
        else if (marks >= 60) { grade = "B"; color = "orange"; }
        else if (marks >= 50) { grade = "C"; color = "blue"; }
        else { grade = "F"; color = "red"; }

        gradeCell.innerText = grade;
        gradeCell.style.color = color;
        badge.innerText = "Modified";
        badge.style.background = "#fddf02";
    }

    function confirmSubmission() {
        if(confirm("Are you sure you want to finalize these marks? They will be sent to the Admin for approval.")) {
            alert("Success! Marks submitted to Admin Dashboard.");
            // Here you would typically use fetch() to send data to your Flask /submit_marks route
        }
    }
</script>

</body>
</html>
