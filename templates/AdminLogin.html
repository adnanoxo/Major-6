<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In (Admin)</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #4E71FF, #8DD8FF);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* LOGIN CARD */
.container {
    width: 360px;
    padding: 30px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.3);
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    text-align: center;
}

/* LOGO */
.logo img {
    width: 220px;
    margin-bottom: 15px;
}

/* TITLE */
h2 {
    color: #fff;
    margin-bottom: 15px;
}

/* INFO TEXT */
.info {
    font-size: 13px;
    color: #eee;
    margin-bottom: 20px;
}

/* INPUT BOX */
.input-box {
    margin-bottom: 15px;
    text-align: left;
}

.input-box label {
    color: #fff;
    font-size: 14px;
}

.input-box input {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.2);
    color: #fff;
    outline: none;
}

/* INPUT FOCUS */
.input-box input:focus {
    border: 1px solid #fff;
    background: rgba(255,255,255,0.3);
}

/* BUTTON */
.btn {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, #ffffff, #dff2ff);
    color: #333;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
    transition: 0.3s;
}

.btn:hover {
    transform: scale(1.03);
}

/* SIGNUP */
.signup {
    margin-top: 15px;
    color: #fff;
}

.signup a {
    color: #fff;
    font-weight: bold;
}

/* CONTACT SECTION */
.about {
    width: 85%;
    margin-top: 25px;
    padding: 20px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.3);
    display: flex;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
    color: #fff;
}

/* COLUMN */
.about div {
    flex: 1;
    min-width: 220px;
}

.about h3 {
    margin-bottom: 10px;
}

.about a {
    color: #fff;
}
</style>
</head>

<body>

<div class="container">
    <div class="logo">
        <img src="images\logosai.jpg">
    </div>

    <h2>Sign In (Admin)</h2>

     

    <form>
        <div class="input-box">
            <label>Enrollment ID</label>
            <input type="text" placeholder="Enter your Enrollment ID">
        </div>

        <div class="input-box">
            <label>Password</label>
            <input type="password" placeholder="Enter password">
        </div>

        <button class="btn">Login</button>
    </form>
    <div class="signup">
         <a href="#">Forgot Password</a>
    </div>
</div>

<div class="about">
    <div>
        <h3>Contact Us</h3>
        <p><b>Sai Nath University</b></p>
        <p>Jirawar, Chandway-Kuchu Road,<br>
        Ormanjhi, Ranchi, Jharkhand - 835219</p>
    </div>

    <div>
        <p><b>Email:</b><br>sainathuniversity@gmail.com</p>
        <p><b>Website:</b><br>
        <a href="https://www.sainathuniversity.com/">www.sainathuniversity.com</a></p>
    </div>

    <div>
        <p><b>Contacts:</b><br>
        +91-7461073942, +91-9050565535,<br>
        +91-6287090506, +91-7280800504,<br>
        +91-7280800502</p>
    </div>
</div>

</body>
</html>
