<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP Registration</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        background: linear-gradient(to right, #3206fb, #42bae9);
        color: #fff;
        display: flex;
    }

    /* Sidebar */
    .sidebar {
        width: 230px;
        height: 100vh;
        background: #2e2e2e;
        padding: 20px;
        position: fixed;
    }

    .sidebar h2 {
        text-align: center;
        margin-bottom: 30px;
    }

    .sidebar a {
        display: block;
        color: #fddf02;
        text-decoration: none;
        margin: 12px 0;
        padding: 12px;
        border-radius: 8px;
        transition: 0.3s;
        cursor: pointer;
    }

    .sidebar a:hover,
    .sidebar .active {
        background: #f4c404;
        color: #fff;
        transform: translate(5px);
        box-shadow: 0 0 8px rgba(253,223,2,0.6),
                    0 0 18px rgba(253,223,2,0.4); 
    }

    /* Main Content Area */
    .main-container {
        margin-left: 270px;
        padding: 30px;
        width: calc(100% - 310px);
    }

    /* HEADER */
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 25px;
        background: rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.15);
        position: sticky;
        top: 20px;
        z-index: 1000;
        margin-bottom: 30px;
    }

    .logout {
        background: #ff815e;
        padding: 8px 16px;
        border-radius: 6px;
        text-decoration: none;
        color: white;
    }

    /* Form Design */
    .form-card {
        background: #ffffff;
        color: #333;
        border-radius: 14px;
        padding: 30px;
        margin-top: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .form-card h2 {
        margin-top: 0;
        color: #3206fb;
        border-bottom: 2px solid #f4c404;
        display: inline-block;
        padding-bottom: 5px;
        margin-bottom: 25px;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: 600;
    }

    .form-group input, .form-group select, .form-group textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
        box-sizing: border-box;
        font-family: 'Inter', sans-serif;
    }

    .submit-btn {
        background: #2575fc;
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
        width: 100%;
        margin-top: 10px;
    }

    .submit-btn:hover {
        background: #3206fb;
        box-shadow: 0 0 15px rgba(66,186,233,0.5);
    }

    .grid-form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }
</style>
</head>

<body>

<div class="sidebar">
    <h2>ERP Portal</h2>
    <a href="{{ url_for ('adash')}}">Dashboard</a>
    <a href="{{ url_for ('sdr')}}">Student Registration</a>
    <a href="#" class="active">Teacher Registration</a>
    <a href="#">Stats</a>
    <a href="#">Support</a>
</div>

<div class="main-container">

    <div class="header">
        <h1>Registration Desk</h1>
        <a href="{{ url_for('logout')}}" class="logout">Logout</a>
    </div>

    

    <!-- Teacher Registration Form -->
    <div class="form-card" style="margin-top: 50px ;">
        <h2>Teacher Registration</h2>
        <form action="{{ url_for('tregisters')}}" method="POST" onsubmit="return handleSubmission()">
            <div class="grid-form">
                <div class="form-group">
                    <label>Faculty Name</label>
                    <input type="text" name="name" placeholder="Enter teacher name" required>
                </div>
                <div class="form-group">
                    <label>Employee ID</label>
                    <input type="text" name="enrollment" placeholder="EMP-101" required>
                </div>
                <div class="form-group">
                    <label>Department</label>
                    <select name="course">
                        <option value="CS">COMPUTER SCIENCE</option>
                        <option value="MGMT">MANAGEMENT</option>
                        <option value="ENG">AGRICULTURE</option>
                        <option value="ENG">LAW</option>
                        <option value="ENG">PHARMACY</option>
                    </select>
                    
                </div>
                <div class="form-group">
    <label>Email ID</label>
    <input type="email" name="email" placeholder="student@university.com">
</div>

<div class="form-group">
    <label>Password</label>
    <input type="password" id="reg_pass" name="password" placeholder="••••••••" required>
</div>

<div class="form-group">
    <label>Confirm Password</label>
    <input type="password" id="reg_confirm" name="confirm_password" placeholder="••••••••" required>

    <span id="pass_warn" style="color: #ff815e; font-size: 12px; font-weight: 600; display: none; margin-top: 8px;">
        ⚠️ Passwords do not match!
    </span>
</div>
            </div>
            <button type="submit" class="submit-btn" style="background: #2e2e2e;">Register Faculty</button>
        </form>
    </div>

    <script>
function handleSubmission() {
    const password = document.getElementById("reg_pass").value;
    const confirm = document.getElementById("reg_confirm").value;
    const warning = document.getElementById("pass_warn");
    const modal = document.getElementById("successModal");

    // 1. Password Match Validation
    if (password !== confirm) {
        warning.style.display = "block";
        return false; // Stops everything if passwords don't match
    }

    // 2. Show the Success Popup
    warning.style.display = "none";
    modal.style.display = "block";

    // 3. Return false temporarily to see the popup
    // Change this to 'true' once you connect your Flask/MySQL backend!
    return true; 
}

function closeModal() {
    document.getElementById("successModal").style.display = "none";
}
</script>

    
</div>
<!-- The Modal (Hidden by default) -->
<div id="successModal" style="display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); backdrop-filter: blur(5px);">
    <div style="background: #ffffff; color: #333; margin: 15% auto; padding: 30px; border-radius: 15px; width: 350px; text-align: center; box-shadow: 0 5px 25px rgba(0,0,0,0.2);">
        <div style="font-size: 50px; color: #2ecc71; margin-bottom: 15px;">✔</div>
        <h2 style="margin: 0; color: #3206fb;">SUCCESS!</h2>
        <p style="color: #666; margin: 15px 0;">Registration details have been submitted successfully.</p>

        <button onclick="closeModal()" style="background: #3206fb; color: white; border: none; padding: 10px 30px; border-radius: 5px; cursor: pointer; font-weight: 600;">OK</button>
    </div>
</div>

</body>
</html>
