<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Portal</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Consolas, monospace;
        }

        body{
            background:#0d1117;
            color:#c9d1d9;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            width:350px;
            background:#161b22;
            padding:35px;
            border:1px solid #30363d;
            border-radius:10px;
            box-shadow:0 0 20px rgba(0,0,0,0.5);
        }

        h1{
            text-align:center;
            margin-bottom:25px;
            color:#58a6ff;
            font-size:24px;
        }

        .input-box{
            margin-bottom:20px;
        }

        .input-box label{
            display:block;
            margin-bottom:8px;
            color:#8b949e;
        }

        .input-box input{
            width:100%;
            padding:12px;
            background:#0d1117;
            border:1px solid #30363d;
            border-radius:6px;
            color:white;
            outline:none;
        }

        .input-box input:focus{
            border-color:#58a6ff;
        }

        button{
            width:100%;
            padding:12px;
            background:#238636;
            border:none;
            border-radius:6px;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#2ea043;
        }

        .footer{
            margin-top:15px;
            text-align:center;
            font-size:13px;
            color:#6e7681;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>RESULT VERIFICATION</h1>

        <form action="/result" method="POST">

            <div class="input-box">
                <label>Enrollment Number</label>
                <input type="text" name="enrollment" required>
            </div>

            <div class="input-box">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>

            <button type="submit">
                View Result
            </button>

        </form>

        <div class="footer">
            Student Examination Portal
        </div>

    </div>

</body>
</html>
