<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        background: linear-gradient(to right, #3206fb, #42bae9);
        color: #fff;
        display: flex;
    }

    .sidebar {
        width: 230px;
        height: 100vh;
        background: #2e2e2e;
        padding: 20px;
        position: fixed;
    }

    .sidebar h2 {
        text-align: center;
        margin-bottom: 30px;
    }

    .sidebar a {
        display: block;
        color: #fddf02;
        text-decoration: none;
        margin: 12px 0;
        padding: 12px;
        border-radius: 8px;
        transition: all 0.3s ease;
        border: 1px solid transparent;
    }

    .sidebar a:hover,
    .sidebar .active {
        background: #f4c404;
        color: #fff;
        transform: translateX(5px);
        box-shadow: 0 0 8px rgba(253,223,2,0.6),
                    0 0 18px rgba(253,223,2,0.4);
    }

    .main {
        margin-left: 250px;
        padding: 30px;
        width: 100%;
    }

    /* 🔥 GLASS HEADER */
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;

        padding: 20px 25px; /* thicker */

        background: rgba(255, 255, 255, 0.15); /* glass effect */
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);

        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.2);

        position: sticky;
        top: 0;
        z-index: 1000;

        transition: all 0.3s ease;

        box-shadow: inset 0 0 10px rgba(255,255,255,0.2);
    }

    /* 🔥 Scroll Glow */
    .header.scrolled {
        background: rgba(255, 255, 255, 0.25);

        box-shadow: 
            0 0 10px rgba(66,186,233,0.3),
            0 0 25px rgba(66,186,233,0.2),
            inset 0 0 10px rgba(255,255,255,0.2);
    }

    .logout {
        background: #ff5e5e;
        padding: 8px 16px;
        border-radius: 6px;
        text-decoration: none;
        color: white;
    }

    .logout:hover {
        box-shadow: 0 0 10px rgba(255,94,94,0.6);
    }

    .erp-btn {
        display: inline-block;
        margin-top: 25px;
        padding: 12px 22px;
        background-color: #2575fc;
        color: white;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 600;
    }

    .erp-btn:hover {
        box-shadow: 0 0 15px rgba(66,186,233,0.5);
    }

    .card-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
        margin-top: 30px;
    }

    .card {
        background: #ffffff;
        color: #333;
        border-radius: 14px;
        padding: 20px;
        transition: all 0.3s ease;
    }

    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 0 20px rgba(66,186,233,0.5);
    }

    .erp-table {
        width: 100%;
        margin-top: 30px;
        border-collapse: collapse;
        background: #fff;
        color: #333;
        border-radius: 10px;
        overflow: hidden;
    }

    .erp-table th {
        background: #f4c404;
        color: #000;
    }

    .erp-table th, .erp-table td {
        padding: 12px;
    }

    .erp-table tr:hover {
        background: #f5f5f5;
    }
</style>
</head>

<body>

<div class="sidebar">
    <h2>Home</h2>
    <a href="#" class="active">Dashboard</a>
    <a href="#">Account</a>
    <a href="#">Stats</a>
    <a href="#">Support</a>
</div>

<div class="main">

    <div class="header">
        <h1>Hello, User</h1>
        <a href="#" class="logout">Logout</a>
    </div>

    <a href="#" class="erp-btn">Go to ERP Form</a>

    <div class="card-container">
        <div class="card">
            <h3>Total Students</h3>
            <p>120</p>
        </div>
        <div class="card">
            <h3>Active Courses</h3>
            <p>8</p>
        </div>
        <div class="card">
            <h3>Pending Requests</h3>
            <p>5</p>
        </div>
    </div>

    <div class="card" style="margin-top: 30px;">
        <h3>Student Overview</h3>
        <canvas id="myChart"></canvas>
    </div>

    <table class="erp-table">
        <tr>
            <th>Name</th>
            <th>Course</th>
            <th>Status</th>
        </tr>
        <tr>
            <td>Rahul Sharma</td>
            <td>BCA</td>
            <td style="color: green;">Active</td>
        </tr>
        <tr>
            <td>Anjali Verma</td>
            <td>MCA</td>
            <td style="color: orange;">Pending</td>
        </tr>
        <tr>
            <td>Amit Kumar</td>
            <td>BBA</td>
            <td style="color: blue;">Completed</td>
        </tr>
    </table>

</div>

<script>
window.addEventListener("scroll", function () {
    let header = document.querySelector(".header");
    if (window.scrollY > 20) {
        header.classList.add("scrolled");
    } else {
        header.classList.remove("scrolled");
    }
});

const ctx = document.getElementById('myChart');

new Chart(ctx, {
    type: 'bar',
    data: {
        labels: ['BCA', 'MCA', 'BBA', 'MBA'],
        datasets: [{
            label: 'Students',
            data: [40, 25, 30, 20],
            borderWidth: 1
        }]
    }
});
</script>

</body>
</html>
